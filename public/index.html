<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Workshop Registration</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Faculty development</p>
        <h1>Workshop registration</h1>
        <p>Browse workshops, reserve a seat, or cancel your registration.</p>

      <p id="load-status" class="status" role="status" aria-live="polite"></p>
      <section id="workshops" class="workshop-list" aria-label="Available workshops"></section>
    </main>
  </body>
</html>
